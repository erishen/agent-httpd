# Build + test gate for agent-httpd.
#
# Five jobs, all required:
#
#   linux-build  — pays for the "works on my Mac" trap. Apple clang stays
#                  silent on -Wstringop-truncation / -Wformat-truncation /
#                  -Wuse-after-free, and only glibc puts -lm / -lcrypt
#                  outside libc. The Dockerfile's `c-build` stage is the
#                  canonical Linux/GCC build, so this reuses it.
#                  (`make test-linux` needs Docker, which ubuntu runners have.)
#
#   macos-unit   — the compile gate under -Wall -Wextra -Werror plus the
#                  standalone suites that need no live server: ASan/UBSan
#                  unit tests and the keep-alive pipelining regression.
#
#   ubuntu-smoke — the full `make test` (scripts/smoke-test.sh): a real
#                  server over HTTP/CGI/FastCGI. The CGI zoo's go/rust
#                  entries are dev-built Mach-O binaries (macOS only; the
#                  script skips them on any other host), while ruby/java/php
#                  are shebang scripts that run wherever their interpreter
#                  exists, so the job needs no toolchain beyond the runner's
#                  python3 + node; every missing runtime is skipped by the
#                  script's own `command -v` guards rather than failed.
#
#   ubuntu-db    — the optional remote backends (WITH_MYSQL=1 / WITH_PG=1)
#                  compile AND reach a live server: fresh mysqld + postgres
#                  on the runner, real connections through db_layer
#                  (make test-db-smoke). Catches bit-rot in the MySQL
#                  backend, which otherwise has no compile coverage at all.
#                  The runner image ships MySQL pre-seeded with root/root,
#                  so the bootstrap probes both passwordless socket auth
#                  and root/root instead of assuming either one.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: all five jobs build and test; none writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Linux / GCC build (Dockerfile c-build stage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Show toolchain
        run: docker version --format 'server {{.Server.Version}}'

      - name: make test-linux
        run: make test-linux

  macos-unit:
    name: macOS / clang build + unit tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Show toolchain
        run: |
          cc --version | head -1
          make --version | head -1

      - name: make all (-Wall -Wextra -Werror)
        run: make all

      - name: make test-unit (ASan + UBSan)
        run: make test-unit

      - name: make test-keepalive (pipelining regression)
        run: make test-keepalive

  ubuntu-fuzz:
    name: Ubuntu / clang libFuzzer + ASan-LSan suite (parser fuzz, leak leg, body-OOM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Install clang (libFuzzer)
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: make fuzz-http (20k runs, ASan+UBSan)
        run: make fuzz-http

      - name: make test-asan (whole suite, ASan + LSan)
        run: make test-asan

      - name: make test-oom (body-OOM 500 regression, LD_PRELOAD fault injection)
        run: make test-oom

  ubuntu-smoke:
    name: Ubuntu / full HTTP-CGI-FastCGI smoke (make test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Show runtimes (node for the React SSR CGI, python3 for CGI + FastCGI)
        run: |
          node --version
          python3 --version
          curl --version | head -1

      - name: make test (scripts/smoke-test.sh full chain)
        run: make test

  ubuntu-db:
    name: Ubuntu / MySQL + PostgreSQL backends compile + live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Install MySQL + PostgreSQL dev packages and servers
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mysql-server libmysqlclient-dev \
            postgresql libpq-dev

      - name: Start MySQL, create smoke database and user
        run: |
          sudo systemctl start mysql.service

          # GitHub's Ubuntu runner image already ships MySQL 8 with root/root
          # (see actions/runner-images, images/ubuntu/Ubuntu*-Readme.md) and
          # `apt-get install mysql-server` does not reinitialise that datadir.
          # A genuinely fresh apt install instead gives root an auth_socket
          # login with no password. The old `sudo mysql` assumed the latter
          # and died with ERROR 1045 (28000) ... (using password: NO). Probe
          # both forms; also treat "mysqld not accepting connections yet" as
          # the same retryable state as "wrong auth".
          mysql_root() {
            if [ "$MYSQL_ROOT_AUTH" = "socket" ]; then
              sudo mysql -u root "$@"
            else
              sudo env MYSQL_PWD=root mysql -u root "$@"
            fi
          }
          MYSQL_ROOT_AUTH=""
          for i in $(seq 1 30); do
            if sudo mysql -u root -e 'SELECT 1' >/dev/null 2>&1; then
              MYSQL_ROOT_AUTH=socket
              break
            fi
            if sudo env MYSQL_PWD=root mysql -u root -e 'SELECT 1' >/dev/null 2>&1; then
              MYSQL_ROOT_AUTH=password
              break
            fi
            sleep 1
          done
          if [ -z "$MYSQL_ROOT_AUTH" ]; then
            echo "::error::mysqld never accepted root auth (tried passwordless socket and root/root)" >&2
            sudo systemctl status mysql.service --no-pager || true
            exit 1
          fi
          echo "MySQL root auth: $MYSQL_ROOT_AUTH"

          # MYSQL_SMOKE_DSN uses 127.0.0.1 (TCP), not the unix socket. With
          # name resolution on the server sees 'localhost'; with
          # skip_name_resolve it sees '127.0.0.1'. Grant both account forms
          # so the next step cannot fail on a host mismatch.
          mysql_root -e "CREATE DATABASE IF NOT EXISTS ahd_smoke; \
            CREATE USER IF NOT EXISTS 'ahd'@'localhost' IDENTIFIED BY 'ahd'; \
            CREATE USER IF NOT EXISTS 'ahd'@'%' IDENTIFIED BY 'ahd'; \
            GRANT ALL ON ahd_smoke.* TO 'ahd'@'localhost'; \
            GRANT ALL ON ahd_smoke.* TO 'ahd'@'%'; \
            FLUSH PRIVILEGES;"

          # Verify the exact path t_db_smoke will take, over TCP as user ahd,
          # so a broken grant names itself here instead of inside make.
          MYSQL_PWD=ahd mysql --protocol=TCP -h 127.0.0.1 -P 3306 \
            -u ahd -D ahd_smoke -e 'SELECT 1 AS mysql_tcp_ok;'

      - name: Start PostgreSQL, create smoke database and user
        run: |
          sudo service postgresql start
          sudo -u postgres psql -c "CREATE USER ahd PASSWORD 'ahd';"
          sudo -u postgres psql -c "CREATE DATABASE ahd_smoke OWNER ahd;"

      - name: make test-db-smoke (both backends against live servers)
        env:
          MYSQL_SMOKE_DSN: mysql://ahd:ahd@127.0.0.1/ahd_smoke
          PG_SMOKE_DSN: postgres://ahd:ahd@127.0.0.1/ahd_smoke
        run: make test-db-smoke WITH_PG=1 WITH_MYSQL=1
