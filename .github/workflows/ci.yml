# Build + test gate for agent-httpd.
#
# Four jobs, all required:
#
#   linux-build  — pays for the "works on my Mac" trap. Apple clang stays
#                  silent on -Wstringop-truncation / -Wformat-truncation /
#                  -Wuse-after-free, and only glibc puts -lm / -lcrypt
#                  outside libc. The Dockerfile's `c-build` stage is the
#                  canonical Linux/GCC build, so this reuses it.
#                  (`make test-linux` needs Docker, which ubuntu runners have.)
#
#   macos-unit   — the compile gate under -Wall -Wextra -Werror plus the
#                  standalone suites that need no live server: ASan/UBSan
#                  unit tests and the keep-alive pipelining regression.
#
#   ubuntu-smoke — the full `make test` (scripts/smoke-test.sh): a real
#                  server over HTTP/CGI/FastCGI. The CGI zoo's go/rust
#                  entries are dev-built Mach-O binaries (macOS only; the
#                  script skips them on any other host), while ruby/java/php
#                  are shebang scripts that run wherever their interpreter
#                  exists, so the job needs no toolchain beyond the runner's
#                  python3 + node; every missing runtime is skipped by the
#                  script's own `command -v` guards rather than failed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Linux / GCC build (Dockerfile c-build stage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: docker version --format 'server {{.Server.Version}}'

      - name: make test-linux
        run: make test-linux

  macos-unit:
    name: macOS / clang build + unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cc --version | head -1
          make --version | head -1

      - name: make all (-Wall -Wextra -Werror)
        run: make all

      - name: make test-unit (ASan + UBSan)
        run: make test-unit

      - name: make test-keepalive (pipelining regression)
        run: make test-keepalive

  ubuntu-fuzz:
    name: Ubuntu / clang libFuzzer + ASan-LSan suite (parser fuzz, leak leg, body-OOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang (libFuzzer)
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: make fuzz-http (20k runs, ASan+UBSan)
        run: make fuzz-http

      - name: make test-asan (whole suite, ASan + LSan)
        run: make test-asan

      - name: make test-oom (body-OOM 500 regression, LD_PRELOAD fault injection)
        run: make test-oom

  ubuntu-smoke:
    name: Ubuntu / full HTTP-CGI-FastCGI smoke (make test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show runtimes (node for the React SSR CGI, python3 for CGI + FastCGI)
        run: |
          node --version
          python3 --version
          curl --version | head -1

      - name: make test (scripts/smoke-test.sh full chain)
        run: make test
