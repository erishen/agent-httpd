<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentHTTPD Chat</title>
<style>
  /* Design tokens mirrored from cgi-bin/react-ssr/styles/main.css */
  :root {
    color-scheme: dark;
    --ink: #0f1420;
    --surface: #1c2536;
    --edge: #334155;
    --accent: #38bdf8;
    --accent-hi: #7dd3fc;
    --accent-ink: #082f49;
    --slate-200: #e2e8f0;
    --slate-300: #cbd5e1;
    --slate-400: #94a3b8;
    --slate-500: #64748b;
    --slate-600: #475569;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--slate-200);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px; }
  .card {
    display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--edge);
    border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,.35);
    overflow: hidden;
  }
  /* header bar */
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--edge);
  }
  .pill {
    background: rgba(56,189,248,.15); color: var(--accent);
    border-radius: 9999px; padding: 2px 12px;
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  }
  #engine-note { font-size: 12px; color: var(--slate-500); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; }
  #session-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--slate-500); }
  .ghost-btn {
    border: 1px solid var(--edge); border-radius: 6px; background: transparent;
    padding: 2px 8px; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--slate-400); cursor: pointer; transition: border-color .15s, color .15s;
  }
  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }
  /* legend */
  .legend {
    display: none; flex-wrap: wrap; align-items: center; gap: 4px 16px;
    padding: 6px 20px; border-bottom: 1px solid rgba(51,65,85,.4);
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--slate-600);
  }
  .legend.show { display: flex; }
  .legend .item { display: flex; align-items: center; gap: 4px; color: var(--slate-500); }
  .dot { width: 6px; height: 6px; border-radius: 9999px; display: inline-block; }
  /* transcript */
  #log {
    display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding: 20px;
    height: max(26rem, calc(100vh - 19rem)); min-height: 24rem;
  }
  .empty { margin: auto; max-width: 28rem; text-align: center; font-size: 14px; color: var(--slate-500); }
  .empty .kind-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin-top: 8px; }
  .kind-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    border: 1px solid; border-radius: 6px; padding: 3px 8px;
  }
  .chip {
    display: inline-flex; max-width: 100%; align-items: center; gap: 6px;
    border: 1px solid; border-radius: 6px; background: rgba(15,20,32,.6);
    padding: 4px 8px; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    cursor: pointer; transition: filter .15s;
  }
  .chip:hover { filter: brightness(1.25); }
  .chip .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip-tag { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 12px; }
  button.chip { font-size: 13px; }
  /* messages */
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .col { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: 92%; min-width: 0; }
  .acts { display: flex; flex-wrap: wrap; gap: 4px; }
  .bubble {
    width: fit-content; max-width: 100%; border-radius: 16px;
    padding: 10px 16px; font-size: 15px; line-height: 1.625; word-break: break-word; min-width: 0;
  }
  .row.user .bubble { background: var(--accent); color: var(--accent-ink); white-space: pre-wrap; }
  .row.bot  .bubble { background: var(--ink); border: 1px solid var(--edge); color: var(--slate-200); }
  .row.bot .bubble.pending .cursor { animation: blink 1s steps(2, start) infinite; color: var(--accent); }
  @keyframes blink { to { visibility: hidden; } }
  .bubble p { margin: 0 0 .75em; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble pre {
    background: var(--ink); border: 1px solid var(--edge); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .bubble code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
  .bubble :not(pre) > code { background: rgba(51,65,85,.5); border-radius: 4px; padding: 1px 5px; }
  .bubble a { color: var(--accent); }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: .8em 0 .4em; line-height: 1.3; }
  .bubble ul, .bubble ol { margin: 0 0 .75em; padding-left: 1.4em; }
  .bubble blockquote { margin: 0 0 .75em; padding-left: 12px; border-left: 3px solid var(--edge); color: var(--slate-400); }
  .copy-btn {
    border: 1px solid rgba(51,65,85,.6); border-radius: 4px; background: transparent;
    padding: 2px 6px; font: 10px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--slate-500); cursor: pointer; opacity: 0; transition: opacity .15s, border-color .15s, color .15s;
  }
  .col:hover .copy-btn, .copy-btn:focus { opacity: 1; }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .followups { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; padding-top: 8px; border-top: 1px solid rgba(51,65,85,.4); }
  .err-inline { color: #f87171; }
  /* composer */
  .composer { display: flex; align-items: center; gap: 8px; padding: 16px; border-top: 1px solid var(--edge); }
  #input {
    flex: 1; min-width: 0; background: var(--ink); border: 1px solid var(--edge);
    border-radius: 8px; padding: 10px 16px; font-size: 14px; color: var(--slate-200);
    outline: none; transition: border-color .15s;
  }
  #input::placeholder { color: var(--slate-600); }
  #input:focus { border-color: var(--accent); }
  #input:disabled { opacity: .6; }
  .main-btn {
    border: 0; border-radius: 8px; padding: 10px 24px; font-weight: 700; font-size: 14px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; transition: background .15s;
  }
  .main-btn:hover { background: var(--accent-hi); }
  .main-btn:disabled { opacity: .4; cursor: default; }
  .stop-btn {
    border: 1px solid var(--edge); border-radius: 8px; padding: 10px 20px;
    background: var(--ink); color: var(--slate-400); font-weight: 700; font-size: 14px; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .stop-btn:hover { border-color: var(--accent); color: var(--accent); }
  footer { padding: 0 20px 16px; font-size: 12px; color: var(--slate-500); }
  footer code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--slate-300); }
  footer .k { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  /* chip color variants (mirror ACT_STYLES) */
  .c-tool   { border-color: rgba(14,165,233,.5);  color: #7dd3fc; } .d-tool   { background: #38bdf8; }
  .c-mcp    { border-color: rgba(167,139,250,.4); color: #a78bfa; } .d-mcp    { background: #a78bfa; }
  .c-skill  { border-color: rgba(52,211,153,.4);  color: #34d399; } .d-skill  { background: #34d399; }
  .c-memory { border-color: rgba(251,191,36,.4);  color: #fcd34d; } .d-memory { background: #fbbf24; }
  .c-pse    { border-color: rgba(232,121,249,.4); color: #e879f9; } .d-pse    { background: #e879f9; }
  .c-round  { border-color: var(--edge); color: var(--slate-400); } .d-round  { background: #64748b; }
  .c-info   { border-color: var(--edge); color: var(--slate-500); } .d-info   { background: #475569; }
</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <div class="bar">
      <span class="pill">SSE stream</span>
      <span id="engine-note">POST /react/api/chat → text/event-stream</span>
      <span class="bar-right">
        <span id="session-id" title=""></span>
        <button class="ghost-btn" id="new-session" title="Mint a fresh session id — the server keeps per-session transcript + facts in .data/sessions/">new session</button>
      </span>
    </div>
    <div class="legend" id="legend">
      <span>Agent stack</span>
      <span class="item"><span class="dot d-tool"></span>TOOL</span>
      <span class="item"><span class="dot d-mcp"></span>MCP</span>
      <span class="item"><span class="dot d-skill"></span>SKILL</span>
      <span class="item"><span class="dot d-memory"></span>MEM</span>
      <span class="item"><span class="dot d-pse"></span>PSE</span>
      <span class="item"><span class="dot d-round"></span>ROUND</span>
    </div>
    <div id="log"></div>
    <div class="composer">
      <input id="input" type="text" placeholder="Type a message…" autocomplete="off">
      <button class="main-btn" id="send" disabled>Send</button>
      <button class="stop-btn" id="stop" style="display:none">Stop</button>
    </div>
    <footer>
      The stream rides the agent stack: <span class="k c-tool">tool</span> ·
      <span class="k c-mcp">mcp</span> · <span class="k c-skill">skill</span> ·
      <span class="k c-memory">memory</span> · <span class="k c-pse">pse</span>
      steps arrive as <code>note</code> events and render as chips; this page stays in sync with
      <code>src/agent.c</code> and <code>src/pse.c</code>. <a href="/react">Home</a>
    </footer>
  </section>
</div>
<script src="/js/chat.js?v=20260914b" defer></script>
</body>
</html>
