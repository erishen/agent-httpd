# agent-httpd 容器编排 —— 三种角色演示:
#   httpd  : agent-httpd 本体 (HTTP 直连), 兼做 FastCGI 后端 (-F)
#   react  : 驻留 React SSR FastCGI 后端 (UNIX socket, 不暴露端口)
#   nginx  : 前置反代 (18081 -> httpd:8080; /react/ 直接 fastcgi_pass 到 react)
#
# 用法:
#   docker compose up -d --build
#     http://localhost:18080  -> agent-httpd 直连 (含 /react/ 的 -R 中继)
#     http://localhost:18081  -> nginx 入口 (静态/CGI 反代, /react/ 走 FastCGI)
#   两个入口最终都打到同一个驻留 React 后端 (一条经 httpd 的 -R 中继, 一条由
#   nginx 直接 fastcgi_pass), 所以 /react/* 的 HTML 逐字节相同、客户端包也是
#   同一个 /js/react-ssr.js。若浏览器里两个入口表现不一致, 先怀疑大响应被
#   截断 (客户端包被切断 -> 模块解析失败 -> 页面静默不水合): `make test-stream`。
#   docker compose logs -f httpd
#
# socket 目录只用一个卷 (react-sock): react 在里面建 react.sock, httpd 在里面建
# fcgi.sock, nginx 只读挂进来连 react.sock。刻意不再声明第二个 fcgi-sock 卷 ——
# 两个卷挂同一个挂载点时 Docker 只让后声明的生效, 前者永远不会被创建 (旧配置就是
# 这样, 且注释声称它把 socket 暴露给了 nginx, 而 nginx.conf 从不 fastcgi_pass 它)。
#
# LLM 上游地址: .env 里的 LLM_API_URL 是给宿主 (make dev / 直接跑 bin/agent-httpd)
# 用的, 通常写成 http://localhost:9070/v1 指向本机 llm-router。容器里的 localhost
# 是容器自己的 loopback, 那个地址连不通, 聊天会静默失败 —— 所以 httpd 与 react
# 两个服务在这里做容器专用覆盖, .env 保持原样, 宿主链路不受影响。
#
# 这层覆盖是可靠的: environment 在 compose 里优先于 env_file, 而服务端自带的 .env
# 加载器是 setenv(..., 0) (已存在者优先), 不会再盖回来; 镜像里也不含 .env
# (.dockerignore 已排除), 所以容器内环境变量就是唯一来源。
#
# Docker Desktop / OrbStack 原生解析 host.docker.internal; 下面 extra_hosts 的
# host-gateway 只是让同一份 compose 在 Linux 上也成立 (实测两者解析到同一 IP)。
# 上游不在宿主本机时换掉它, 例如:
#   LLM_API_URL_CONTAINER=http://10.0.0.5:9070/v1 docker compose up -d
x-llm-api-url: &container_llm_api_url "${LLM_API_URL_CONTAINER:-http://host.docker.internal:9070/v1}"

services:
  httpd:
    build: .
    image: agent-httpd:latest
    container_name: agent-httpd
    environment:
      PORT: "8080"
      WORKERS: "8"          # prefork worker 池; 0 = fork-per-connection
      RATE_LIMIT: "0"       # 每 IP 限流 (req/s); 0 = 关闭
      FCGI_SOCK: /run/agent-httpd/fcgi.sock
      REACT_SOCK: /run/agent-httpd/react.sock
      # 容器内覆盖 .env 的 localhost 上游 (见文件顶部说明)
      LLM_API_URL: *container_llm_api_url
      # 一次性清缓存开关。开着的期间, HTML 响应额外带
      # Clear-Site-Data: "cache", 浏览器收到后会丢掉本 origin 的 HTTP 缓存。
      # 存在的理由: 服务端改缓存策略只能约束"今后"的响应, 拦不住浏览器里
      # 早已存下的旧副本 (缓存条目自带写入时的策略, 没有任何响应头能撤回它)。
      # 这是唯一不需要用户动手的补救办法。让所有客户端都访问过一次后, 改成
      # "0" 或删掉这两行 —— 开着时重复访问者每次访问都会被清一次缓存。
      PURGE_CLIENT_CACHE: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # C 聊天端点 (/react/api/chat, src/llm.c) 在 httpd 进程内调 LLM 上游,
    # LLM_* 配置同样从项目根 .env 注入 (文件不存在也能启动, 回落演示引擎);
    # 上面的 LLM_API_URL 覆盖只改地址, KEY / MODEL 仍走 .env
    env_file:
      - path: .env
        required: false
    volumes:
      # 单个 socket 目录卷: -F 在这里建 fcgi.sock, -R 在这里连 react.sock
      - react-sock:/run/agent-httpd
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8080')+'/health')"]
      interval: 15s
      timeout: 3s
      start_period: 5s
    restart: unless-stopped

  react:
    # 与 httpd 同一镜像, 只启动驻留 React SSR 后端 (标准 FastCGI 协议)
    image: agent-httpd:latest
    build: .
    container_name: agent-httpd-react
    command: ["react-backend"]
    environment:
      REACT_FCGI_SOCK: /run/agent-httpd/react.sock
      # nginx 的 worker 跑在 uid 101, 不是本容器的账号, 而本 compose 里 nginx
      # 服务存在的意义就是演示 /react/ 的 fastcgi_pass 直连 —— 不开这个开关
      # 该路径必然 502, 文档也就成了空话。服务端默认 (0700) 之所以收紧, 是因为
      # 直连 socket 会绕过 httpd 的认证/限流; 而这个 socket 只存在于 dockerd 的
      # 命名卷里, 仅本栈三个容器可见, 不落宿主机路径, 因此这里放宽不增加暴露面。
      # 单独跑 react 后端 (不经本 compose) 时默认仍是 0700。
      REACT_FCGI_SOCK_MODE: "0777"
      # chat.ts 同样读 process.env.LLM_API_URL (值守后端进程, 启动时读一次),
      # 容器内必须用宿主网关地址, 理由与 httpd 一致
      LLM_API_URL: *container_llm_api_url
      # 一次性清缓存开关, 与 httpd 同名同义 (SSR 文档由本进程直接产出,
      # C 侧补不了它的头)。清完同样建议改回 "0" 或删掉。
      PURGE_CLIENT_CACHE: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # LLM 聊天后端配置从项目根 .env 注入 (LLM_API_URL / LLM_API_KEY / LLM_MODEL);
    # 文件不存在也能启动 —— 回落到内置演示引擎
    env_file:
      - path: .env
        required: false
    volumes:
      - react-sock:/run/agent-httpd
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: agent-httpd-nginx
    depends_on:
      - httpd
      - react
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # react.sock 共享给 nginx, fastcgi_pass 直连驻留 React 后端
      - react-sock:/run/agent-httpd:ro
    ports:
      - "18081:80"
    restart: unless-stopped

volumes:
  react-sock:
