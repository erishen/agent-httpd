# agent-httpd 容器编排 —— 三种角色演示:
#   httpd  : agent-httpd 本体 (HTTP 直连), 兼做 FastCGI 后端 (-F)
#   react  : 驻留 React SSR FastCGI 后端 (UNIX socket, 不暴露端口)
#   nginx  : 前置反代 (8081 -> httpd:8080; /react/ 直接 fastcgi_pass 到 react)
#
# 用法:
#   docker compose up --build
#     http://localhost:18080  -> agent-httpd 直连
#     http://localhost:18081  -> nginx 入口 (静态/CGI 反代, /react/ 走 FastCGI)
#   docker compose logs -f httpd

services:
  httpd:
    build: .
    image: agent-httpd:latest
    container_name: agent-httpd
    environment:
      PORT: "8080"
      WORKERS: "8"          # prefork worker 池; 0 = fork-per-connection
      RATE_LIMIT: "0"       # 每 IP 限流 (req/s); 0 = 关闭
      FCGI_SOCK: /run/agent-httpd/fcgi.sock
      REACT_SOCK: /run/agent-httpd/react.sock
    # C 聊天端点 (/react/api/chat, src/llm.c) 在 httpd 进程内调 LLM 上游,
    # LLM_* 配置同样从项目根 .env 注入 (文件不存在也能启动, 回落演示引擎)
    env_file:
      - path: .env
        required: false
    volumes:
      # FastCGI 监听 socket 通过共享卷暴露给 nginx (演示 nginx fastcgi_pass);
      # 同时让 agent-httpd -R 能直连 react.sock 作 FCGI 客户端 (中继 /react/*)
      - fcgi-sock:/run/agent-httpd
      - react-sock:/run/agent-httpd
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8080')+'/health')"]
      interval: 15s
      timeout: 3s
      start_period: 5s
    restart: unless-stopped

  react:
    # 与 httpd 同一镜像, 只启动驻留 React SSR 后端 (标准 FastCGI 协议)
    image: agent-httpd:latest
    build: .
    container_name: agent-httpd-react
    command: ["react-backend"]
    environment:
      REACT_FCGI_SOCK: /run/agent-httpd/react.sock
    # LLM 聊天后端配置从项目根 .env 注入 (LLM_API_URL / LLM_API_KEY / LLM_MODEL);
    # 文件不存在也能启动 —— 回落到内置演示引擎
    env_file:
      - path: .env
        required: false
    volumes:
      - react-sock:/run/agent-httpd
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: agent-httpd-nginx
    depends_on:
      - httpd
      - react
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # react.sock 共享给 nginx, fastcgi_pass 直连驻留 React 后端
      - react-sock:/run/agent-httpd:ro
    ports:
      - "18081:80"
    restart: unless-stopped

volumes:
  fcgi-sock:
  react-sock:
