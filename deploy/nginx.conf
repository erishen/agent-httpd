# agent-httpd 前置 nginx —— 两种后端协议并存演示:
#
#   1. HTTP 反向代理: 静态页与 CGI 动物园都打给 agent-httpd (proxy_pass),
#      由 agent-httpd 自己 fork CGI、协商 gzip、发 ETag/304。
#   2. FastCGI 直连: /react/* 越过 agent-httpd 直接 fastcgi_pass 到驻留
#      React 后端 (标准 FastCGI 协议, socket chmod 0777 就是为此准备的)。
#      对比路径: httpd 容器里 -R 也能中继 /react/* —— 那条链是
#      agent-httpd 作 FCGI 客户端, 这条链是 nginx 作 FCGI 客户端。

upstream agent_httpd {
    server httpd:8080;
}

server {
    listen 80;
    server_name _;

    # 默认: HTTP 反代到 agent-httpd
    location / {
        proxy_pass http://agent_httpd;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # LLM 聊天数据端点: agent-httpd 进程内原生处理 (src/llm.c, fork curl
    # 调上游), 不再进 React FastCGI 后端。SSE 流式, 关闭缓冲直通。
    location = /react/api/chat {
        proxy_pass http://agent_httpd;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # SSR 页面: nginx 直接与驻留 React 后端对话 (FastCGI)
    location /react {
        include fastcgi_params;
        fastcgi_pass unix:/run/agent-httpd/react.sock;
        # stock fastcgi_params 缺的几个参数 (react 后端消费 REQUEST_URI/
        # HTTP_HOST/HTTP_ACCEPT/REMOTE_ADDR 等, 其余已被 include 覆盖)
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_ACCEPT $http_accept;
        fastcgi_param HTTP_USER_AGENT $http_user_agent;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 30s;
        fastcgi_buffering off;   # SSR 流式响应直通
    }

    # 健康检查端点直通 (不进 access log)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
